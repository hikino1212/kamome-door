<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>かもめのはばたき</title>
<!-- iPhone の「ホーム画面に追加」で使われるアイコンと名前 -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<!-- プッシュ通知に必要（iPhone はホーム画面に追加したアプリだけ通知を受けとれる） -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="かもめ">
<!-- 時計のところは iPhone の標準の色（上下がずれないように、空の色にする設定はやめた） -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#4FAEEC">
<meta name="robots" content="noindex, nofollow">
<style>
  :root{--top:#4FAEEC;--bottom:#FFFFFF}
  @media (prefers-color-scheme:dark){:root{--top:#0B2140;--bottom:#1A3050}}
  /* 入り口ページ自体はスクロールさせない（中のアプリだけがスクロールする） */
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
  body{position:fixed;inset:0}
  /* 上（時計のところ）は空の色、下はアプリの下のタブと同じ色（すき間ができてもタブとつながって見える） */
  body{background:linear-gradient(180deg,var(--top) 0,var(--top) 50%,var(--bottom) 50%,var(--bottom) 100%)}
  /* アプリは見えている範囲いっぱいに表示（はみ出すと下のタブが見えなくなるので、画面の高さで無理に広げない） */
  iframe{position:fixed;top:0;left:0;width:100%;height:100%;border:0;background:transparent;
    box-sizing:border-box}
  .alt{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));
    font:14px sans-serif;color:#23395B;background:#fff;border-radius:999px;padding:8px 16px;box-shadow:0 2px 8px rgba(0,0,0,.2);text-decoration:none}
  .alt.show{display:block}
  /* アイコンのバッジ（数字）を出すための許可のお願い。ホーム画面のアプリで、まだ許可していないときだけ出す */
  .bdg{display:none;position:fixed;left:50%;transform:translateX(-50%);top:calc(96px + env(safe-area-inset-top,0px));z-index:5;
    width:min(440px,calc(100% - 24px));box-sizing:border-box;background:#fff;color:#23395B;border-radius:16px;padding:10px 12px;
    box-shadow:0 6px 20px rgba(0,0,0,.25);font:14px/1.5 "Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;align-items:center;gap:8px}
  .bdg.show{display:flex}
  .bdg span{flex:1}
  .bdg button{border:0;border-radius:999px;font:inherit;font-weight:700;padding:8px 12px;cursor:pointer}
  .bdg .ok{background:#3E9BD6;color:#fff}.bdg .no{background:#eef3f8;color:#23395B}
  /* Face ID（パスキー）の画面。Face ID はこのページ（いちばん外）でしか使えないので、ここでボタンを出して、押してもらう */
  .pk{display:none;position:fixed;inset:0;z-index:9;background:rgba(20,32,52,.55);align-items:center;justify-content:center;padding:16px}
  .pk.show{display:flex}
  .pk .box{width:min(380px,100%);background:#fff;color:#23395B;border-radius:20px;padding:22px 18px;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.3);
    font:15px/1.6 "Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif}
  .pk .ic{font-size:46px;line-height:1}.pk h2{font-size:19px;margin:8px 0 4px}.pk p{margin:0 0 14px;font-size:14px;color:#566B88}
  .pk button{display:block;width:100%;border:0;border-radius:14px;font:inherit;font-weight:700;padding:13px;cursor:pointer;margin-top:8px}
  .pk .go{background:#3E9BD6;color:#fff;font-size:17px}.pk .no{background:#eef3f8;color:#23395B}
</style>
</head>
<body>
<!-- かもめのはばたき 本体（Apps Script・家族のURL） -->
<iframe id="app" title="かもめのはばたき" allow="camera; clipboard-write"></iframe>
<div class="bdg" id="bdg"><span>🔔 新しい質問や答えがとどいたら、お知らせ（通知）とアイコンの数字で知らせますか？</span><button class="ok" id="bdgok">はい</button><button class="no" id="bdgno">あとで</button></div>
<div class="pk" id="pk" role="dialog" aria-modal="true"><div class="box"><div class="ic">🙂</div><h2 id="pkt"></h2><p id="pkx"></p>
  <button class="go" id="pkgo"></button><button class="no" id="pkno">やめる</button></div></div>
<a class="alt" id="alt" href="https://script.google.com/macros/s/AKfycbzxFht0qINnNU6t3k_GtJUmvYtPnqxWcKr-bY2piIxFuecn_5DZKD-583IaVB0Lrs_s4A/exec" target="_top">ひらけないときは ここをタップ</a>
<script>
  // ログインを ずっと たもつ：アプリからもらった「端末キー」をここ（ホーム画面のアプリ側）に保存し、
  // 開くたびにアプリへ渡す。あいことば そのものは保存しない。
  var EXEC = 'https://script.google.com/macros/s/AKfycbzxFht0qINnNU6t3k_GtJUmvYtPnqxWcKr-bY2piIxFuecn_5DZKD-583IaVB0Lrs_s4A/exec';
  var KEY = 'kamome_token', t = null;
  try { t = localStorage.getItem(KEY); } catch (e) {}
  var app = document.getElementById('app'), loaded = false;
  app.src = EXEC + (t && /^dt_[A-Za-z0-9]{20,80}$/.test(t) ? '?dt=' + encodeURIComponent(t) : '');
  app.addEventListener('load', function () { loaded = true; });
  // 12秒たっても開かないときだけ「ひらけないとき」を出す
  setTimeout(function () { if (!loaded) document.getElementById('alt').className = 'alt show'; }, 12000);
  window.addEventListener('message', function (e) {
    var host = ''; try { host = new URL(e.origin).hostname; } catch (x) {}
    if (!/\.googleusercontent\.com$/.test(host)) return;   // アプリ（Google の画面）からのメッセージだけ受け取る
    var d = e.data || {};
    try {
      if (d.type === 'kamome-token' && /^dt_[A-Za-z0-9]{20,80}$/.test(d.token)) localStorage.setItem(KEY, d.token);
      if (d.type === 'kamome-logout') localStorage.removeItem(KEY);
      if (d.type === 'kamome-haptic') { haptic(d.n === 2 ? 2 : 1); }
      if (d.type === 'kamome-pk-ping') { e.source.postMessage({ type: 'kamome-pk-pong', ok: pkOk(), reg: localStorage.getItem('kamome_pk') === '1' }, e.origin); }
      if (d.type === 'kamome-pk' && pkOk()) { pkShow(d, e.source, e.origin); }
      if (d.type === 'kamome-pk-saved') { localStorage.setItem('kamome_pk', '1'); }
      if (d.type === 'kamome-badge') { badge(Math.max(0, Math.min(99, parseInt(d.n, 10) || 0))); appWin = e.source; appOrigin = e.origin; sendTok(); }
    } catch (x) {}
  });
  // クイズの手ごたえ（iPhone は iOS 18 から、スイッチを押したときの手ごたえを使える）。アプリは Google の枠の中で手ごたえを出せないので、
  // いちばん外のこのページで出す。iPhone の「設定 → サウンドと触覚 → システムの触覚」がオンのときだけ。
  function hapticOnce() {
    var l = document.createElement('label'); l.setAttribute('aria-hidden', 'true'); l.style.display = 'none';
    var i = document.createElement('input'); i.type = 'checkbox'; i.setAttribute('switch', '');
    l.appendChild(i); document.head.appendChild(l); l.click(); document.head.removeChild(l);
  }
  function haptic(n) { try { hapticOnce(); if (n === 2) setTimeout(hapticOnce, 90); } catch (x) {} }
  // iPhone のアイコンのバッジ（ホーム画面に追加したアプリで、通知を許可したときだけ出せる：iOS 16.4 から）
  // アプリを開くたび・1分ごとに、アプリから「やること」の数をもらって数字を更新する。閉じている間は、最後に開いたときの数のまま。
  var standalone = (window.navigator.standalone === true) || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  var bdg = document.getElementById('bdg'), lastN = 0;
  function canBadge() { return 'setAppBadge' in navigator; }
  // ---- プッシュ通知（Firebase Cloud Messaging）。下の設定はパパが Firebase で作ったもの（公開してよい値。秘密の鍵ではない） ----
  var FB = { apiKey: 'AIzaSyDM8002cLWvOuiUrxvA6KhRela-lDz92Xs', authDomain: 'kamome-habataki.firebaseapp.com', projectId: 'kamome-habataki',
    storageBucket: 'kamome-habataki.firebasestorage.app', messagingSenderId: '604651061750', appId: '1:604651061750:web:291536e15c78ffbaa407d7' };
  var VAPID = 'BFV1q6yMPjgmjeqyOCWlB8rGd4wnPP3XR3dUsfwb12nFsvkwNGjNrK6Z1vC8hMpxueJuzi8-8_hU2r9k7Swd7CY';   // Firebase の「ウェブプッシュ証明書」の公開鍵
  var FBV = '10.12.2', pushTok = null, tokSent = false, appWin = null, appOrigin = '';
  try { pushTok = localStorage.getItem('kamome_push'); } catch (x) {}
  function pushReady() { return !!(FB.apiKey && FB.projectId && FB.messagingSenderId && FB.appId && VAPID) && 'serviceWorker' in navigator && 'PushManager' in window; }
  function getPushToken() {
    if (!pushReady() || !('Notification' in window) || Notification.permission !== 'granted') return Promise.resolve(null);
    return navigator.serviceWorker.register('sw.js', { scope: './' }).then(function (reg) {
      return Promise.all([import('https://www.gstatic.com/firebasejs/' + FBV + '/firebase-app.js'), import('https://www.gstatic.com/firebasejs/' + FBV + '/firebase-messaging.js')])
        .then(function (mods) {
          return mods[1].isSupported().then(function (ok) {
            if (!ok) return null;
            var fapp = mods[0].initializeApp(FB);
            return mods[1].getToken(mods[1].getMessaging(fapp), { vapidKey: VAPID, serviceWorkerRegistration: reg });
          });
        });
    }).then(function (t) {
      if (t) { if (t !== pushTok) tokSent = false; pushTok = t; try { localStorage.setItem('kamome_push', t); } catch (x) {} sendTok(); }
      return t;
    }).catch(function () { return null; });
  }
  // 通知の宛先をアプリにわたす（アプリがサーバーに登録する。だれの端末かはアプリのログインで決まる）
  function sendTok() { if (pushTok && appWin && !tokSent) { try { appWin.postMessage({ type: 'kamome-push-token', token: pushTok }, appOrigin); tokSent = true; } catch (x) {} } }
  if (standalone && 'Notification' in window && Notification.permission === 'granted') getPushToken();
  function badge(n) {
    lastN = n;
    if (!canBadge() && !pushReady()) return;
    var perm = ('Notification' in window) ? Notification.permission : 'denied';
    if (perm === 'granted') { if (canBadge()) (n ? navigator.setAppBadge(n) : navigator.clearAppBadge()).catch(function () {}); return; }
    var later = 0; try { later = +localStorage.getItem('kamome_badge_later') || 0; } catch (x) {}
    if (standalone && perm === 'default' && Date.now() - later > 7 * 86400000) bdg.className = 'bdg show';
  }
  // ---- Face ID（パスキー）：アプリからお願いが来たら、このページにボタンを出す。押したら Face ID を呼んで、結果をアプリへ返す ----
  // サーバー（Apps Script）が署名を確かめる。秘密の鍵は iPhone から出ない。
  function pkOk() { return !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create); }
  var pkReq = null, pkWin = null, pkOrigin = '';
  function u8(s) { s = String(s || '').replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function b64u(buf) { var a = new Uint8Array(buf), s = ''; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  function pkShow(d, win, origin) {
    pkReq = d; pkWin = win; pkOrigin = origin;
    document.getElementById('pkt').textContent = d.title || 'Face ID';
    document.getElementById('pkx').textContent = d.text || '';
    document.getElementById('pkgo').textContent = d.btn || 'Face ID を使う';
    document.getElementById('pk').className = 'pk show';
  }
  function pkReply(m) { try { pkWin.postMessage(m, pkOrigin); } catch (x) {} }
  document.getElementById('pkno').onclick = function () { document.getElementById('pk').className = 'pk'; pkReply({ type: 'kamome-pk-result', ok: false, err: 'cancel' }); };
  document.getElementById('pkgo').onclick = function () {
    var d = pkReq || {}, o = d.opts || {}; document.getElementById('pk').className = 'pk';
    var p;
    if (d.mode === 'create') {
      p = navigator.credentials.create({ publicKey: { challenge: u8(o.challenge), rp: { id: o.rpId, name: o.rpName || 'かもめのはばたき' },
        user: { id: u8(o.userId), name: o.userName, displayName: o.userDisplay }, pubKeyCredParams: [{ type: 'public-key', alg: -7 }],
        authenticatorSelection: { authenticatorAttachment: 'platform', residentKey: 'required', requireResidentKey: true, userVerification: 'required' },
        excludeCredentials: (o.exclude || []).map(function (id) { return { type: 'public-key', id: u8(id) }; }), attestation: 'none', timeout: 60000 } })
        .then(function (c) { return { id: c.id, clientDataJSON: b64u(c.response.clientDataJSON), attestationObject: b64u(c.response.attestationObject) }; });
    } else {
      p = navigator.credentials.get({ publicKey: { challenge: u8(o.challenge), rpId: o.rpId, userVerification: 'required', timeout: 60000 } })
        .then(function (c) { return { id: c.id, clientDataJSON: b64u(c.response.clientDataJSON), authenticatorData: b64u(c.response.authenticatorData), signature: b64u(c.response.signature) }; });
    }
    p.then(function (data) { pkReply({ type: 'kamome-pk-result', ok: true, data: data }); })
     .catch(function (er) { pkReply({ type: 'kamome-pk-result', ok: false, err: (er && er.name) || 'error' }); });
  };
  document.getElementById('bdgok').onclick = function () {
    bdg.className = 'bdg';
    if (!('Notification' in window)) return;
    Notification.requestPermission().then(function (p) { if (p === 'granted') { badge(lastN); getPushToken(); } }).catch(function () {});
  };
  document.getElementById('bdgno').onclick = function () {
    bdg.className = 'bdg'; try { localStorage.setItem('kamome_badge_later', String(Date.now())); } catch (x) {}
  };
</script>
</body>
</html>
